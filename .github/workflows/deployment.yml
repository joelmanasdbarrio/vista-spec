name: CI & Publish OpenAPI Package

permissions:
  contents: write           # para commits y pushes
  packages: write           # para publicar en GitHub Packages

on:
  pull_request:
    branches:
      - dev       # corre en PRs hacia dev
      - release   # corre en PRs hacia release
      - main      # corre en PRs hacia main
    types:
      - opened
      - synchronize
      - reopened
      - closed    # para PR cerrado y mergeado

jobs:
  # ── 1. VALIDATE ────────────────────────────────────────────────────
  validate-specification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18', cache: 'npm' }
      - run: npm ci
      - run: npm run validate
        name: Validate OpenAPI spec

  # ── 2. CHECK VERSIONS ─────────────────────────────────────────────
  check-version:
    needs: validate-specification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18', cache: 'npm' }
      - run: npm ci
      - name: Read package.json version
        id: pkg
        uses: ActionsTools/read-json-action@main
        with: { file_path: package.json }
      - name: Read OpenAPI info.version
        id: spec
        uses: actions-tools/yaml-outputs@v2.1
        with:
          file-path: openapi/openapi-rest.yaml
          separator: '__'
      - run: |
          if [ "${{ steps.pkg.outputs.version }}" != "${{ steps.spec.outputs.info__version }}" ]; then
            echo "::error ::Version mismatch: package.json (${{
            steps.pkg.outputs.version }}) vs OpenAPI spec (${{
            steps.spec.outputs.info__version }})"
            exit 1
          fi
        name: Ensure versions match

  # ── 3. GENERATE TYPES ─────────────────────────────────────────────
  generate-types:
    needs: check-version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18', cache: 'npm' }
      - run: npm ci
      - run: rm -rf types/
        name: Clean previous types
      - run: npm run generate:types
        name: Generate TS types
      - uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: "regenerate OpenAPI types"

  # ── 4. PUBLISH PACKAGE ────────────────────────────────────────────
  publish-package:
    needs: generate-types
    runs-on: ubuntu-latest
    # Solo en PR hacia dev, release o cierre de PR a main
    if: |
      github.event.pull_request.base.ref == 'dev' ||
      github.event.pull_request.base.ref == 'release' ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          registry-url: https://npm.pkg.github.com/
      - run: npm ci

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine version and tag
        id: ver
        run: |
          BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF##*/}}
          echo "Branch = $BRANCH"
          if [ "$BRANCH" = "dev" ]; then
            NEW=$(npm version prerelease --preid=dev)
            TAG=dev
          elif [ "$BRANCH" = "release" ]; then
            NEW=$(npm version prerelease --preid=rc)
            TAG=rc
          else
            NEW=$(npm version patch)
            TAG=latest
          fi
          echo "new_version=$NEW" >> $GITHUB_OUTPUT
          echo "dist_tag=$TAG"    >> $GITHUB_OUTPUT

      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.DEPLOYMENT_TOKEN }}" > ~/.npmrc

      - name: Publish package
        run: |
          if [ "${{ steps.ver.outputs.dist_tag }}" = "latest" ]; then
            npm publish --access=restricted
          else
            npm publish --access=restricted --tag "${{ steps.ver.outputs.dist_tag }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}

      - name: Comment on PR with result
        uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.DEPLOYMENT_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ Se publicó la versión **${{ steps.ver.outputs.new_version }}** con dist-tag `**${{ steps.ver.outputs.dist_tag }}**`.
