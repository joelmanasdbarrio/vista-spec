name: CI & Publish OpenAPI Package

permissions:
  contents: write
  packages: write

on:
  pull_request:
    branches:
      - dev
      - release
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

jobs:
  validate-specification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18', cache: 'npm' }
      - run: npm ci
      - run: npm run validate
        name: Validate OpenAPI spec

  check-version:
    needs: validate-specification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18', cache: 'npm' }
      - run: npm ci
      - name: Read package.json version
        id: pkg
        uses: ActionsTools/read-json-action@main
        with: { file_path: package.json }
      - name: Read OpenAPI info.version
        id: spec
        uses: actions-tools/yaml-outputs@v2.1
        with:
          file-path: openapi/openapi-rest.yaml
          separator: '__'
      - run: |
          if [ "${{ steps.pkg.outputs.version }}" != "${{ steps.spec.outputs.info__version }}" ]; then
            echo "::error ::Version mismatch: package.json (${{
            steps.pkg.outputs.version }}) vs OpenAPI spec (${{
            steps.spec.outputs.info__version }})"
            exit 1
          fi
        name: Ensure versions match

  generate-types:
    needs: check-version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18', cache: 'npm' }
      - run: npm ci
      - run: rm -rf types/
        name: Clean previous types
      - run: npm run generate:types
        name: Generate TS types
      - uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: "regenerate OpenAPI types"

  publish-package:
    permissions:
      contents: write           # Necesario para git commit/tag/push
      packages: write           # Necesario para npm publish en GitHub Packages
      issues: write             # Necesario para comentar en PRs
      pull-requests: write      # Necesario para comentar en pull requests
    needs: generate-types
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.base.ref == 'dev' ||
      github.event.pull_request.base.ref == 'release' ||
      (github.event.pull_request.base.ref == 'main' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout repository (with full history + tags)
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@joelmanasdbarrio'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine version and tag
        id: ver
        run: |
          BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF##*/}}

          if [ "$BRANCH" = "dev" ]; then
            NEW=$(npm version prerelease --preid=dev)
            TAG=dev
          elif [ "$BRANCH" = "release" ]; then
            CURRENT=$(npm pkg get version | sed 's/"//g')
            NEW="$CURRENT-rc"
            npm version "$NEW" --force
            TAG=rc
          else
            NEW=$(npm version patch)
            TAG=latest
          fi

          echo "new_version=$NEW" >> $GITHUB_OUTPUT
          echo "dist_tag=$TAG"    >> $GITHUB_OUTPUT

      - name: Authenticate to GitHub Packages
        run: |
          echo "@joelmanasdbarrio:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.DEPLOYMENT_TOKEN }}" >> ~/.npmrc

      - name: Publish to GitHub Packages
        run: |
          if [ "${{ steps.ver.outputs.dist_tag }}" = "latest" ]; then
            npm publish
          else
            npm publish --tag "${{ steps.ver.outputs.dist_tag }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}

      - name: Comment on PR with result
        uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ Publicado paquete **@joelmanasdbarrio/vista-spec@${{ steps.ver.outputs.new_version }}** con dist-tag `**${{ steps.ver.outputs.dist_tag }}**`.
