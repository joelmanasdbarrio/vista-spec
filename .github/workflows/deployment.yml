name: Validate and publish OpenAPI specification

permissions:
  contents: write

on:
  push:
  pull_request:

jobs:
  validate-specification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI specification
        run: npm run validate

  check-version:
    runs-on: ubuntu-latest
    needs: validate-specification
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read package.json version
        id: pkg
        uses: ActionsTools/read-json-action@v1
        with:
          file_path: package.json

      - name: Read OpenAPI info.version
        id: spec
        uses: actions-tools/yaml-outputs@v2.1
        with:
          file-path: openapi/openapi-rest.yaml
          separator: '__'

      - name: Ensure versions match
        run: |
          pkg_ver="${{ steps.pkg.outputs.version }}"
          spec_ver="${{ steps.spec.outputs.info__version }}"
          echo "package.json version = $pkg_ver"
          echo "OpenAPI info.version = $spec_ver"
          if [ "$pkg_ver" != "$spec_ver" ]; then
            echo "::error ::Version mismatch between package.json and OpenAPI spec"
            exit 1
          fi

  generate-types:
    runs-on: ubuntu-latest
    needs: check-version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean previous types
        run: rm -rf types/

      - name: Generate TypeScript types
        run: npm run generate:types

      - name: Commit and push generated types
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: github-actions@github.com
          message: regenerate OpenAPI types

  publish-package:
    needs: generate-types
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          registry-url: https://npm.pkg.github.com/

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: |
          BRANCH=${GITHUB_REF##*/}
          if [ "$BRANCH" = "main" ]; then
            # patch bump, crea commit y tag vX.Y.Z
            npm version patch
          else
            # prerelease bump con sufijo "dev", e.g. 1.2.3 → 1.2.4-dev.0
            npm version prerelease --preid=dev
          fi
        env:
          CI: true

      - name: Publish package
        run: |
          if [ "$BRANCH" = "main" ]; then
            npm publish --access=restricted
          else
            npm publish --access=restricted --tag=dev
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}