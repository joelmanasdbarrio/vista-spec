name: CI & Publish OpenAPI Package

permissions:
  contents: write
  packages: write

on:
  pull_request:
    branches: [dev, release]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  validate-specification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18', cache: 'npm' }
      - run: npm ci
      - run: npm run validate
        name: Validate OpenAPI spec

  check-version:
    needs: validate-specification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18', cache: 'npm' }
      - run: npm ci
      - name: Read package.json version
        id: pkg
        uses: ActionsTools/read-json-action@main
        with: { file_path: package.json }
      - name: Read OpenAPI info.version
        id: spec
        uses: actions-tools/yaml-outputs@v2.1
        with:
          file-path: openapi/openapi-rest.yaml
          separator: '__'
      - run: |
          if [ "${{ steps.pkg.outputs.version }}" != "${{ steps.spec.outputs.info__version }}" ]; then
            echo "::error ::Version mismatch: package.json (${{
            steps.pkg.outputs.version }}) vs OpenAPI spec (${{
            steps.spec.outputs.info__version }})"
            exit 1
          fi
        name: Ensure versions match

  generate-types:
    needs: check-version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18', cache: 'npm' }
      - run: npm ci
      - run: rm -rf types/
        name: Clean previous types
      - run: npm run generate:types
        name: Generate TS types
      - uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: "regenerate OpenAPI types"

  publish-package-dev:
    needs: generate-types
    if: github.event.action != 'closed' && (github.base_ref == 'dev')
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
      - name: Calculate version
        id: version
        run: |
          BASE_VERSION=${{ needs.check-version.outputs.base_version }}
          VERSION=${BASE_VERSION}-dev.$GITHUB_RUN_NUMBER
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "new_version=$VERSION" >> $GITHUB_OUTPUT
      - name: Publish package
        run: |
          npm publish --tag dev --access public

      - name: Comment on PR with result
        if: success()
        uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.DEPLOYMENT_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ Published `development` version as **@joelmanasdbarrio/vista-spec@${{ steps.version.outputs.new_version }}** (`dev`).

      - name: Comment on PR with error
        if: failure()
        uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.DEPLOYMENT_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ❌ Error publishing `development` version. Review workflow logs for more information.

  publish-package-release:
    needs: generate-types
    if: github.event.action != 'closed' && (github.base_ref == 'release')
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
      - name: Calculate version
        id: version
        run: |
          BASE_VERSION=${{ needs.check-version.outputs.base_version }}
          VERSION=${BASE_VERSION}-rc
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "new_version=$VERSION" >> $GITHUB_OUTPUT
      - name: Publish package
        run: |
          npm publish --tag rc --access public

      - name: Comment on PR with result
        if: success()
        uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.DEPLOYMENT_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ Published `release` candidate version as **@joelmanasdbarrio/vista-spec@${{ steps.version.outputs.new_version }}** (`rc`).

      - name: Comment on PR with error
        if: failure()
        uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.DEPLOYMENT_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ❌ Error publishing `release` version. Review workflow logs for more information.

  publish-package-main:
    needs: generate-types
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - name: Get package info
        id: package-info
        run: |
          echo "package_name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "package_version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - run: npm publish --tag latest --access public
      - name: Add job summary
        run: |
          echo "✅ Published `main` version as **${{ steps.package-info.outputs.package_name }}@${{ steps.package-info.outputs.package_version }}** (`latest`)." >> $GITHUB_STEP_SUMMARY