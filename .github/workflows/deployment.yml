name: CI & Publish OpenAPI Package

permissions:
  contents: write
  packages: write

on:
  pull_request:
    branches: [dev, release]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  validate-specification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18', cache: 'npm' }
      - run: npm ci
      - run: npm run validate
        name: Validate OpenAPI spec

  check-version:
    needs: validate-specification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18', cache: 'npm' }
      - run: npm ci
      - name: Read package.json version
        id: pkg
        uses: ActionsTools/read-json-action@main
        with: { file_path: package.json }
      - name: Read OpenAPI info.version
        id: spec
        uses: actions-tools/yaml-outputs@v2.1
        with:
          file-path: openapi/openapi-rest.yaml
          separator: '__'
      - run: |
          if [ "${{ steps.pkg.outputs.version }}" != "${{ steps.spec.outputs.info__version }}" ]; then
            echo "::error ::Version mismatch: package.json (${{
            steps.pkg.outputs.version }}) vs OpenAPI spec (${{
            steps.spec.outputs.info__version }})"
            exit 1
          fi
        name: Ensure versions match

  generate-types:
    needs: check-version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18', cache: 'npm' }
      - run: npm ci
      - run: rm -rf types/
        name: Clean previous types
      - run: npm run generate:types
        name: Generate TS types
      - uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: "regenerate OpenAPI types"

  publish-package:
    needs: generate-types
    if: github.event.action != 'closed' && (github.base_ref == 'dev' || github.base_ref == 'release')
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
      - name: Get package scope
        id: scope
        run: |
          SCOPE=$(node -p "require('./package.json').name.split('/')[0]")
          echo "scope=${SCOPE}" >> $GITHUB_OUTPUT
      - name: Calculate version
        id: version
        run: |
          BASE_VERSION=${{ needs.check-version.outputs.base_version }}
          if [ "${{ github.base_ref }}" == "dev" ]; then
            echo "VERSION=${BASE_VERSION}-dev.$GITHUB_RUN_NUMBER" >> $GITHUB_ENV
            echo "TAG=dev" >> $GITHUB_ENV
          else
            echo "VERSION=${BASE_VERSION}-rc" >> $GITHUB_ENV
            echo "TAG=rc" >> $GITHUB_ENV
          fi
      - name: Publish package
        run: |
          npm version $VERSION --no-git-tag-version
          npm publish --tag $TAG --access public
      - name: Notify PR
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚀 Job `publish-package` - ${{ job.status == 'success' && '✅ Publicado' || '❌ Fallo' }}
            Package: ${{ needs.check-version.outputs.package_name }}@${{ env.VERSION }}
            Dist-tag: ${{ env.TAG }}
            [Ver paquete](https://github.com/${{ github.repository }}/packages)

  production-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
      - name: Get package info
        id: package-info
        run: |
          echo "package_name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "package_version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - run: npm ci
      - run: npm publish --tag latest --access public
      - name: Notify release
        uses: actions/github-script@v6
        if: always()
        with:
          script: |
            const { package_name, package_version } = process.env
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🎉 Release publicado - ${process.env.JOB_STATUS}\nPackage: ${package_name}@${package_version}\nDist-tag: latest\n[Ver paquete](https://github.com/${context.repo.owner}/${context.repo.repo}/packages)`
            })
        env:
          JOB_STATUS: ${{ job.status == 'success' && '✅ Éxito' || '❌ Fallo' }}
          package_name: ${{ steps.package-info.outputs.package_name }}
          package_version: ${{ steps.package-info.outputs.package_version }}