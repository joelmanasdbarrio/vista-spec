name: Cleanup old dev/rc package versions

on:
  schedule:
    - cron:  '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CLEANUP_TOKEN }}
      CLEANUP_AFTER: ${{ vars.CLEANUP_AFTER }}

    steps:
      - uses: actions/checkout@v4

      - name: Read package name
        id: pkg
        run: |
          echo "::set-output name=name::$(jq -r .name package.json)"

      - name: Encode package name for URL
        id: enc
        run: |
          ENC=$(echo -n "${{ steps.pkg.outputs.name }}" | jq -s -R -r @uri)
          echo "::set-output name=encoded::${ENC}"

      - name: List all versions
        run: |
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            /user/packages/${{ steps.enc.outputs.encoded }}/versions \
            --paginate > versions.json

      - name: Delete old “dev”/“rc” versions
        run: |
          NOW=$(date +%s)
          jq -c '.[] | select(.name | test("dev|rc"))' versions.json \
          | while IFS= read -r v; do
              ID=$(echo "$v" | jq -r .id)
              NAME=$(echo "$v" | jq -r .name)
              CREATED=$(echo "$v" | jq -r .created_at)
              AGE=$(( (NOW - $(date --date="$CREATED" +%s)) / 3600 ))
              if [ "$AGE" -gt "$CLEANUP_AFTER" ]; then
                echo "Deleting $NAME (id $ID), age ${AGE}h"
                gh api --method DELETE \
                  /user/packages/${{ steps.enc.outputs.encoded }}/versions/$ID
              fi
            done
