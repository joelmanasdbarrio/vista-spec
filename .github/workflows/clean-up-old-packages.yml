name: Cleanup old dev/rc package versions

permissions:
  contents: read
  packages: write

on:
  schedule:
    - cron: '0 6 * * *' # Every day at 6am UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get package name from package.json
        id: pkg
        run: echo "PACKAGE_NAME=$(jq -r .name package.json)" >> $GITHUB_ENV
      - name: List and delete old dev/rc versions
        env:
          GH_TOKEN: ${{ secrets.CLEANUP_TOKEN }}
          OWNER: joelmanasdbarrio
          REPO: vista-spec
          CLEANUP_AFTER: ${{ vars.CLEANUP_AFTER }}
        run: |
          ENCODED_PACKAGE_NAME=$(echo -n "$PACKAGE_NAME" | jq -s -R -r @uri)
          gh api -H "Accept: application/vnd.github+json" \
            /repos/$OWNER/$REPO/packages/npm/$ENCODED_PACKAGE_NAME/versions \
            --paginate > versions.json

          NOW=$(date +%s)

          jq -c '.[] | select(.metadata.container.tags | index("dev") or index("rc"))' versions.json | while IFS= read -r version; do
            VERSION_ID=$(echo "$version" | jq -r '.id')
            CREATED_AT=$(echo "$version" | jq -r '.created_at')
            VERSION_NAME=$(echo "$version" | jq -r '.name')
            CREATED_AT_SEC=$(date --date="$CREATED_AT" +%s)
            AGE_HOURS=$(( (NOW - CREATED_AT_SEC) / 3600 ))
            if [ "$AGE_HOURS" -gt "$CLEANUP_AFTER" ]; then
              echo "Deleting $VERSION_NAME (ID: $VERSION_ID, Age: $AGE_HOURS hours)"
              gh api --method DELETE /repos/$OWNER/$REPO/packages/npm/$ENCODED_PACKAGE_NAME/versions/$VERSION_ID
            fi
          done