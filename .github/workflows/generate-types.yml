name: Generate OpenAPI Types

# 1) Se dispara en cada push/pull_request a cualquier rama;
#    se puede restringir a ramas concretas con `branches: [ main ]`.
on:
  push:
  pull_request:

jobs:
  generate-types:
    runs-on: ubuntu-latest

    steps:
      # 2) Obtiene código
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # necesario para poder push más adelante
          persist-credentials: true

      # 3) Prepara Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'

      # 4) Instala dependencias
      - name: Install dependencies
        run: npm ci

      # 5) Genera los tipos
      - name: Generate TypeScript types
        run: npm run generate:types

      # 6) Commit & push de los cambios generados
      - name: Commit and push generated types
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: github-actions@github.com
          message: regenerate OpenAPI types
          # si la rama está protegida y requiere revisión, esto fallará
