          $ref: '#/components/schemas/AccountDTO'
    FollowResponse:
      type: object
      required: [data]
      properties:
        status:
          type: string
          enum: [success]
          default: success
        data:
          $ref: '#/components/schemas/FollowDTO'
    FollowRequestsResponse:
      allOf:
        - type: object
          required: [data]
          properties:
            status:
              type: string
              enum: [success]
              default: success
        - $ref: '#/components/schemas/FollowRequestsPaginatedDTO'
    FollowRequestResponse:
      type: object
      required: [data]
      properties:
        status:
          type: string
          enum: [success]
          default: success
        data:
          $ref: '#/components/schemas/FollowRequestDTO'
    NotificationsResponse:
      allOf:
        - type: object
          required: [data]
          properties:
            status:
              type: string
              enum: [success]
              default: success
        - $ref: '#/components/schemas/NotificationsPaginatedDTO'
    NotificationResponse:
      type: object
      required: [data]
      properties:
        status:
          type: string
          enum: [success]
          default: success
        data:
          $ref: '#/components/schemas/NotificationDTO'
    ActivitiesResponse:
      allOf:
        - type: object
          required: [data]
          properties:
            status:
              type: string
              enum: [success]
              default: success
        - $ref: '#/components/schemas/ActivitiesPaginatedDTO'
    ActivityResponse:
      type: object
      required: [data]
      properties:
        status:
          type: string
          enum: [success]
          default: success
        data:
          $ref: '#/components/schemas/ActivityDTO'
    ActivityParticipantsResponse:
      allOf:
        - type: object
          required: [data]
          properties:
            status:
              type: string
              enum: [success]
              default: success
        - $ref: '#/components/schemas/AccountsPersonalPaginatedDTO'
    ActivityParticipantResponse:
      type: object
      required: [data]
      properties:
        status:
          type: string
