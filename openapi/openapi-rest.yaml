      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    AccountDTO:
      oneOf:
        - $ref: '#/components/schemas/AccountPersonalDTO'
        - $ref: '#/components/schemas/AccountEnterpriseDTO'
      discriminator:
        propertyName: type
    AccountPersonalDTO:
      allOf:
        - $ref: '#/components/schemas/AccountBase'
      type: object
      required:
        - gender
        - type
      properties:
        gender:
          type: string
          enum:
            - male
            - female
            - other
          default: other
        type:
          type: string
          enum:
            - personal
          default: personal
    AccountEnterpriseDTO:
      allOf:
        - $ref: '#/components/schemas/AccountBase'
      type: object
      required:
        - type
      properties:
        isVerified:
          type: boolean
          default: false
        type:
          type: string
          enum:
            - enterprise
          default: enterprise
    AccountBase:
      type: object
      required:
        - name
        - username
        - email
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 50
          pattern: '(^[a-zA-Zñ\s]+$)'
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '(^[a-z_0-9]+$)'
        email:
          type: string
          pattern: '^[A-Za-z0-9._%+-]+@(?:gmail|hotmail|outlook|yahoo|icloud|aol|zoho|mail|protonmail|inbox|gmx|yandex|mailinator|disroot|tutanota|fastmail|startmail|runbox|hushmail|mailfence|posteo|riseup|kolabnow|mailbox|openmailbox|airmail|comcast|att|verizon|shaw|telus|charter|frontier|cox|btinternet|talktalk|virginmedia|sky|o2|orange|free|sfr|numericable|laposte|bouyguestelecom|neuf|alice|libero)\.[A-Za-z]{2,}$'
        biography:
          type: string
        avatar:
          type: string
        website:
          type: string
        isPrivate:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FollowDTO:
      type: object
      required:
        - follower
        - following
        - isMuted
      properties:
        id:
          type: string
          format: uuid
        follower:
          $ref: '#/components/schemas/AccountPersonalDTO'
        following:
          $ref: '#/components/schemas/AccountDTO'
        isMuted:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FollowRequestDTO:
      type: object
      required:
        - requestFrom
        - requestTo
        - status
      properties:
        id:
          type: string
          format: uuid
        requestFrom:
          $ref: '#/components/schemas/AccountPersonalDTO'
        requestTo:
          $ref: '#/components/schemas/AccountDTO'
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
          default: pending
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NotificationDTO:
      type: object
      required:
        - id
        - type
        - content
        - isRead
        - owner
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - follow
            - entry
            - activity
            - system
        content:
          type: string
        isRead:
          type: boolean
          default: false
        owner:
          $ref: '#/components/schemas/AccountDTO'
        relatedAccount:
          $ref: '#/components/schemas/AccountDTO'
        relatedActivity:
          $ref: '#/components/schemas/ActivityDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AddressDTO:
      type: object
      required:
        - country
        - postalCode
        - city
        - street
        - number
        - coordinates
      properties:
        country:
          type: string
        postalCode:
          type: string
        city:
          type: string
        street:
          type: string
        number:
          type: string
        block:
          type: string
        floor:
          type: string
        stair:
          type: string
        door:
          type: string
        coordinates:
          type: object
          properties:
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ActivityDTO:
      oneOf:
        - $ref: '#/components/schemas/ActivityOnsiteDTO'
        - $ref: '#/components/schemas/ActivityOnlineDTO'
      discriminator:
        propertyName: type
    ActivityOnsiteDTO:
      allOf:
        - $ref: '#/components/schemas/ActivityBase'
      type: object
      required:
        - location
        - type
      properties:
        location:
          oneOf:
            - $ref: '#/components/schemas/EstablishmentDTO'
            - $ref: '#/components/schemas/AddressDTO'
        type:
          type: string
          enum:
            - map
    ActivityOnlineDTO:
      allOf:
        - $ref: '#/components/schemas/ActivityBase'
      type: object
      required:
        - location
        - type
      properties:
        location:
          type: object
          required:
            - url
          properties:
            url:
              type: string
        type:
          type: string
          enum:
            - online
    ActivityBase:
      type: object
      required:
        - owner
        - category
        - title
        - description
        - time
        - language
      properties:
        id:
          type: string
          format: uuid
        owner:
          $ref: '#/components/schemas/AccountDTO'
        category:
          $ref: '#/components/schemas/ActivityCategoryDTO'
        title:
          type: string
        description:
          type: string
        iamges:
          type: array
          items:
            type: string
        time:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        price:
          type: object
          properties:
            min:
              type: number
              format: double
              default: 0.0
            max:
              type: number
              format: double
              default: 0.0
            currency:
              type: string
        participants:
          type: object
          properties:
            min:
              type: integer
              format: int32
            max:
              type: integer
              format: int32
        language:
          type: string
          enum:
            - en
            - es
        website:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ActivityCategoryDTO:
      type: object
      required:
        - id
        - name
        - i18nKey
        - icon
      properties:
        id:
          type: string
          format: uuid
        parent:
          $ref: '#/components/schemas/ActivityCategoryDTO'
        name:
          type: string
        i18nKey:
          type: string
        icon:
          type: string
        color:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ActivityParticipantDTO:
      type: object
      required:
        - id
        - activity
        - account
      properties:
        id:
          type: string
          format: uuid
        activity:
          $ref: '#/components/schemas/ActivityDTO'
        account:
          $ref: '#/components/schemas/AccountPersonalDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EstablishmentDTO:
      type: object
      required:
        - owner
        - address
        - name
      properties:
        id:
          type: string
          format: uuid
        owner:
          $ref: '#/components/schemas/AccountEnterpriseDTO'
        address:
          $ref: '#/components/schemas/AddressDTO'
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EstablishmentRequestDTO:
      type: object
      required:
        - requestFromAccount
        - requestForActivity
        - requestToEstablishment
      properties:
        id:
          type: string
          format: uuid
        requestFromAccount:
          $ref: '#/components/schemas/AccountEnterpriseDTO'
        requestForActivity:
          $ref: '#/components/schemas/ActivityOnsiteDTO'
        requestToEstablishment:
          $ref: '#/components/schemas/EstablishmentDTO'
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    accountIdParam:
      name: id
      description: Account ID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    accountTypeParam:
      name: type
      description: Account type
      in: query
      schema:
        type: string
        enum:
          - personal
          - enterprise
    accountNameParam:
      name: name
      description: Account name
      in: query
      schema:
        type: string
        minLength: 2
        maxLength: 50
        pattern: '(^[a-zA-Zñ\s]+$)'
    accountUsernameParam:
      name: username
      description: Account username
      in: query
      schema:
        type: string
        minLength: 4
        maxLength: 30
        pattern: '(^[a-z_0-9]+$)'
    followRequestIdParam:
      name: id
      description: Follow request ID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    notificationIdParam:
      name: id
      description: Notification ID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    establishmentIdParam:
      name: id
      description: Establishment ID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    establishmentNameParam:
      name: name
      description: Establishment name
      in: query
      schema:
        type: string
    establishmentAddressParam:
      name: address
      description: Establishment address
      in: query
      schema:
        type: string
    establishmentRequestIdParam:
      name: id
      description: Establishment request ID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    activityIdParam:
      name: id
      description: Activity ID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    activityTitleParam:
      name: title
      description: Activity title
      in: query
      schema:
        type: string
    activityDescriptionParam:
      name: description
      description: Activity description
      in: query
      schema:
        type: string
    activityCategoryIdParam:
      name: categoryId
      description: Activity category ID
      in: query
      schema:
        type: string
        format: uuid
    activityMinPriceParam:
      name: minPrice
      description: Activity min price
      in: query
      schema:
        type: number
        format: double
    activityMaxPriceParam:
      name: maxPrice
      description: Activity max price
      in: query
      schema:
        type: number
        format: double
    activityLanguageParam:
      name: language
      description: Activity language
      in: query
      schema:
        type: string
    activityTypeParam:
      name: type
      description: Activity type
      in: query
      schema:
        type: string
        enum:
          - map
          - online
    activityTimeStartParam:
      name: timeStart
      description: Activity time start
      in: query
      schema:
        type: string
        format: date-time
    activityTimeEndParam:
      name: timeEnd
      description: Activity time end
      in: query
      schema:
        type: string
        format: date-time
    activityMinParcipantsParam:
      name: minParticipants
      description: Activity min participants
      in: query
      schema:
        type: integer
        format: int32
    activityMaxParcipantsParam:
      name: maxParticipants
      description: Activity max participants
      in: query
      schema:
        type: integer
        format: int32
    activityMinEntriesParam:
      name: minEntries
      description: Activity min entries
      in: query
      schema:
        type: integer
        format: int32
    activityMaxEntriesParam:
      name: maxEntries
      description: Activity max entries
      in: query
      schema:
        type: integer
        format: int32
  responses:
    BadRequestError:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Bad Request
              code:
                type: string
                example: BAD_REQUEST
              status:
                type: integer
                format: int32
                example: 400
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthorized
              code:
                type: string
                example: UNAUTHORIZED
              status:
                type: integer
                format: int32
                example: 401
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Forbidden
              code:
                type: string
                example: FORBIDDEN
              status:
                type: integer
                format: int32
                example: 403
    NotFoundError:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Not Found
              code:
                type: string
                example: NOT_FOUND
              status:
                type: integer
                format: int32
                example: 404
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Internal Server Error
              code:
                type: string
                example: INTERNAL_SERVER_ERROR
              status:
                type: integer
                format: int32
                example: 500