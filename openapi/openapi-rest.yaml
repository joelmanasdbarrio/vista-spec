  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    pageParam:
      name: page
      description: Page number for pagination
      in: query
      schema:
        type: integer
        format: int32
        default: 1
    limitParam:
      name: limit
      description: Number of items per page for pagination
      in: query
      schema:
        type: integer
        format: int32
        default: 10
    accountIdParam:
      name: id
      description: Account ID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    accountTypeParam:
      name: type
      description: Account type
      in: query
      schema:
        type: string
        enum:
          - personal
          - enterprise
    accountNameParam:
      name: name
      description: Account name
      in: query
      schema:
        type: string
        minLength: 2
        maxLength: 50
        pattern: '(^[a-zA-Zñ\s]+$)'
    accountUsernameParam:
      name: username
      description: Account username
      in: query
      schema:
        type: string
        minLength: 4
        maxLength: 30
        pattern: '(^[a-z_0-9]+$)'
    followRequestIdParam:
      name: id
      description: Follow request ID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    notificationIdParam:
      name: id
      description: Notification ID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    establishmentIdParam:
      name: id
      description: Establishment ID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    establishmentNameParam:
      name: name
      description: Establishment name
      in: query
      schema:
        type: string
    establishmentAddressParam:
      name: address
      description: Establishment address
      in: query
      schema:
        type: string
    establishmentOwnerParam:
      name: owner
      description: Establishment owner ID
      in: query
      schema:
        type: string
        format: uuid
    establishmentRequestIdParam:
      name: requestId
      description: Establishment request ID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    activityIdParam:
      name: id
      description: Activity ID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    activityTitleParam:
      name: title
      description: Activity title
      in: query
      schema:
        type: string
    activityDescriptionParam:
      name: description
      description: Activity description
      in: query
      schema:
        type: string
    activityCategoryIdParam:
      name: categoryId
      description: Activity category ID
      in: query
      schema:
        type: string
        format: uuid
    activityMinPriceParam:
      name: minPrice
      description: Activity min price
      in: query
      schema:
        type: number
        format: double
    activityMaxPriceParam:
      name: maxPrice
      description: Activity max price
      in: query
      schema:
        type: number
        format: double
    activityLanguageParam:
      name: language
      description: Activity language
      in: query
      schema:
        type: string
    activityTypeParam:
      name: type
      description: Activity type
      in: query
      schema:
        type: string
        enum:
          - onsite
          - online
    activityTimeStartParam:
      name: timeStart
      description: Activity time start
      in: query
      schema:
        type: string
        format: date-time
    activityTimeEndParam:
      name: timeEnd
      description: Activity time end
      in: query
      schema:
        type: string
        format: date-time
    activityMinParcipantsParam:
      name: minParticipants
      description: Activity min participants
      in: query
      schema:
        type: integer
        format: int32
    activityMaxParcipantsParam:
      name: maxParticipants
      description: Activity max participants
      in: query
      schema:
        type: integer
        format: int32
    activityMinEntriesParam:
      name: minEntries
      description: Activity min entries
      in: query
      schema:
        type: integer
        format: int32
    activityMaxEntriesParam:
      name: maxEntries
      description: Activity max entries
      in: query
      schema:
        type: integer
        format: int32
  responses:
    BadRequestError:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [error]
                default: error
              statusCode:
                type: integer
                format: int32
                example: 400
              errors:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                      example: INVALID_EMAIL_FORMAT
                    message:
                      type: string
                      example: Email format not valid
                    details:
                      type: string
                      example: Use user@domain.com format
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [error]
                default: error
              statusCode:
                type: integer
                format: int32
                example: 401
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: Unauthorized
                  details:
                    type: string
                    example: You must be logged in to access this resource
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [error]
                default: error
              statusCode:
                type: integer
                format: int32
                example: 403
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: FORBIDDEN
                  message:
                    type: string
                    example: Forbidden
                  details:
                    type: string
                    example: You do not have permission to access this resource
    NotFoundError:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [error]
                default: error
              statusCode:
                type: integer
                format: int32
                example: 404
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_FOUND
                  message:
                    type: string
                    example: Resource not found
                  details:
                    type: string
                    example: The requested resource could not be found
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [error]
                default: error
              statusCode:
                type: integer
                format: int32
                example: 500
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: An unexpected error occurred
                  details:
                    type: string
                    example: Please try again later or contact support