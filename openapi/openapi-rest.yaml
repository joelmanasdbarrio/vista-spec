          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /establishments/{id}/requests/{requestId}:
    patch:
      tags:
        - Establishments
      summary: Update establishment request
      operationId: updateEstablishmentRequest
      description: Update one establishment request
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/establishmentIdParam'
        - $ref: '#/components/parameters/establishmentRequestIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstablishmentRequestDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Establishments
      summary: Delete establishment request
      operationId: deleteEstablishmentRequest
      description: Delete one establishment request
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/establishmentIdParam'
        - $ref: '#/components/parameters/establishmentRequestIdParam'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    AccountDTO:
      oneOf:
        - $ref: '#/components/schemas/AccountPersonalDTO'
        - $ref: '#/components/schemas/AccountEnterpriseDTO'
      discriminator:
        propertyName: accountType
    AccountPersonalDTO:
      allOf:
        - $ref: '#/components/schemas/AccountBase'
      type: object
      required:
        - gender
        - accountType
      properties:
        gender:
          type: string
          enum:
            - male
            - female
            - other
          default: other
        birthdate:
          type: string
          format: date
        accountType:
          type: string
          enum: [personal]
          default: personal
    AccountEnterpriseDTO:
      allOf:
        - $ref: '#/components/schemas/AccountBase'
      type: object
      required:
        - accountType
      properties:
        isVerified:
          type: boolean
          default: false
        accountType:
          type: string
          enum: [enterprise]
          default: enterprise
    AccountBase:
      type: object
      required:
        - id
        - name
        - username
        - email
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 50
          pattern: '(^[a-zA-Zñ\s]+$)'
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '(^[a-z_0-9]+$)'
        email:
          type: string
          pattern: '^[A-Za-z0-9._%+-]+@(?:gmail|hotmail|outlook|yahoo|icloud|aol|zoho|mail|protonmail|inbox|gmx|yandex|mailinator|disroot|tutanota|fastmail|startmail|runbox|hushmail|mailfence|posteo|riseup|kolabnow|mailbox|openmailbox|airmail|comcast|att|verizon|shaw|telus|charter|frontier|cox|btinternet|talktalk|virginmedia|sky|o2|orange|free|sfr|numericable|laposte|bouyguestelecom|neuf|alice|libero)\.[A-Za-z]{2,}$'
        biography:
          type: string
        avatar:
          type: string
        website:
          type: string
        isPrivate:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FollowDTO:
      type: object
      required:
        - id
        - follower
        - following
        - isMuted
      properties:
        id:
          type: string
          format: uuid
        follower:
          $ref: '#/components/schemas/AccountPersonalDTO'
        following:
          $ref: '#/components/schemas/AccountDTO'
        isMuted:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FollowRequestDTO:
      type: object
      required:
        - id
        - requestFrom
        - requestTo
        - status
      properties:
        id:
          type: string
          format: uuid
        requestFrom:
          $ref: '#/components/schemas/AccountPersonalDTO'
        requestTo:
          $ref: '#/components/schemas/AccountDTO'
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
          default: pending
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NotificationDTO:
      type: object
      required:
        - id
        - type
        - content
        - isRead
        - owner
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - follow
            - followRequest
            - establishmentRequest
            - entry
            - activity
            - system
        content:
          type: string
        isRead:
          type: boolean
          default: false
        owner:
          $ref: '#/components/schemas/AccountDTO'
        relatedAccount:
          $ref: '#/components/schemas/AccountDTO'
        relatedActivity:
          $ref: '#/components/schemas/ActivityDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AddressDTO:
      type: object
      required:
        - country
        - postalCode
        - city
        - street
        - number
        - coordinates
      properties:
        id:
          type: string
          format: uuid
        country:
          type: string
        postalCode:
          type: string
        city:
          type: string
        street:
          type: string
        number:
          type: string
        block:
          type: string
        floor:
          type: string
        stair:
          type: string
        door:
          type: string
        coordinates:
          type: object
          properties:
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ActivityDTO:
      oneOf:
        - $ref: '#/components/schemas/ActivityOnsiteDTO'
        - $ref: '#/components/schemas/ActivityOnlineDTO'
      discriminator:
        propertyName: activityType
    ActivityOnsiteDTO:
      allOf:
        - $ref: '#/components/schemas/ActivityBase'
      type: object
      required:
        - location
        - activityType
      properties:
        location:
          oneOf:
            - $ref: '#/components/schemas/EstablishmentDTO'
            - $ref: '#/components/schemas/AddressDTO'
        activityType:
          type: string
          enum: [onsite]
          default: onsite
    ActivityOnlineDTO:
      allOf:
        - $ref: '#/components/schemas/ActivityBase'
      type: object
      required:
        - location
        - activityType
      properties:
        location:
          type: object
          required:
            - url
          properties:
            url:
              type: string
        activityType:
          type: string
          enum: [online]
          default: online
    ActivityBase:
      type: object
      required:
        - owner
        - category
        - title
        - description
        - time
        - language
      properties:
        id:
          type: string
          format: uuid
        owner:
          $ref: '#/components/schemas/AccountDTO'
        category:
          $ref: '#/components/schemas/ActivityCategoryDTO'
        title:
          type: string
        description:
          type: string
        images:
          type: array
          default: []
          items:
            type: string
        time:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        price:
          type: object
          properties:
            min:
              type: number
              format: double
              default: 0.0
            max:
              type: number
              format: double
              default: 0.0
            currency:
              type: string
        participants:
          type: object
          properties:
            min:
              type: integer
              format: int32
            max:
              type: integer
              format: int32
        language:
          type: string
          enum:
            - en
            - es
        website:
          type: string
        isDraft:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ActivityCategoryDTO:
      type: object
      required:
        - id
        - name
        - i18nKey
        - icon
      properties:
        id:
          type: string
          format: uuid
        parent:
          $ref: '#/components/schemas/ActivityCategoryDTO'
        name:
          type: string
        i18nKey:
          type: string
        icon:
          type: string
        color:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ActivityParticipantDTO:
      type: object
      required:
        - id
        - activity
        - account
      properties:
        id:
          type: string
          format: uuid
        activity:
          $ref: '#/components/schemas/ActivityDTO'
        account:
          $ref: '#/components/schemas/AccountPersonalDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EstablishmentDTO:
      type: object
      required:
        - owner
        - address
        - name
      properties:
        id:
          type: string
          format: uuid
        owner:
          $ref: '#/components/schemas/AccountEnterpriseDTO'
        address:
          $ref: '#/components/schemas/AddressDTO'
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EstablishmentRequestDTO:
      type: object
      required:
        - requestFromAccount
        - requestForActivity
        - requestToEstablishment
      properties:
        id:
          type: string
          format: uuid
        requestFromAccount:
          $ref: '#/components/schemas/AccountEnterpriseDTO'
        requestForActivity:
          $ref: '#/components/schemas/ActivityOnsiteDTO'
        requestToEstablishment:
          $ref: '#/components/schemas/EstablishmentDTO'
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    # Paginated DTOs
    PaginatedDTO:
      type: object
      properties:
        _meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            results:
              type: integer
              example: 0
            total:
              type: integer
              example: 0
    AccountsPaginatedDTO:
      allOf:
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AccountDTO'
        - $ref: '#/components/schemas/PaginatedDTO'
    AccountsPersonalPaginatedDTO:
      allOf:
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AccountPersonalDTO'
        - $ref: '#/components/schemas/PaginatedDTO'
    FollowRequestsPaginatedDTO:
      allOf:
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/FollowRequestDTO'
        - $ref: '#/components/schemas/PaginatedDTO'
    NotificationsPaginatedDTO:
      allOf:
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/NotificationDTO'
        - $ref: '#/components/schemas/PaginatedDTO'
    ActivitiesPaginatedDTO:
      allOf:
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ActivityDTO'
        - $ref: '#/components/schemas/PaginatedDTO'
    EstablishmentsPaginatedDTO:
      allOf:
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/EstablishmentDTO'
        - $ref: '#/components/schemas/PaginatedDTO'
    EstablishmentRequestsPaginatedDTO:
      allOf:
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/EstablishmentRequestDTO'
        - $ref: '#/components/schemas/PaginatedDTO'
# Responses
    AccountsResponse:
      allOf:
        - type: object
          properties:
